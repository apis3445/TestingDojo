trigger: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily Postman tests
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: npm install -g newman newman-reporter-junitfull newman-reporter-htmlextra
    displayName: Install Newman and reporters

  - script: |
      newman run postman/TestingDojo.postman_collection.json \
        --environment postman/TestingDojoDemo.postman_environment.json \
        --env-var "companyAdmin=$(COMPANY)" \
        --env-var "userNameAdmin=$(ADMIN_USER)" \
        --env-var "passwordAdmin=$(ADMIN_PASSWORD)" \
        --env-var "company=$(COMPANY)" \
        --env-var "userName=$(NORMAL_USER)" \
        --env-var "password=$(NORMAL_PASSWORD)" \
        --env-var "AuthAPI=$(AUTH_URL)" \
        --env-var "language=$(LANGUAGE)" \
        --env-var "userIdAdmin=$(USER_ID_ADMIN)" \
        --env-var "nameAdmin=$(NAME_ADMIN)" \
        --env-var "emailAdmin=$(EMAIL_ADMIN)" \
        --env-var "companyKeyAdmin=$(COMPANY_KEY_ADMIN)" \
        --env-var "userId=$(USER_ID)" \
        --env-var "name=$(NAME)" \
        --env-var "email=$(EMAIL)" \
        --env-var "companyKey=$(COMPANY_KEY)" \
        --reporters cli,junitfull,htmlextra \
        --reporter-junitfull-export $(Build.ArtifactStagingDirectory)/postman-results.xml \
        --reporter-htmlextra-export $(Build.ArtifactStagingDirectory)/newman-report.html \
        --reporter-htmlextra-title "Postman – $(Build.BuildNumber)"
    displayName: Run Postman collection

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: postman-results.xml
      searchFolder: $(Build.ArtifactStagingDirectory)
      testRunTitle: Postman – $(Build.BuildNumber)
      failTaskOnFailedTests: true

  - task: UploadPostmanHtmlReport@1
    displayName: Publish Postman HTML report tab
    condition: always()
    inputs:
      cwd: $(Build.ArtifactStagingDirectory)
      tabName: Postman Report
      
