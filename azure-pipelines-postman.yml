trigger: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily Postman tests
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
    displayName: Install Postman CLI

  - script: postman login --with-api-key "$POSTMAN_API_KEY"
    displayName: Log in to Postman CLI
    env:
      POSTMAN_API_KEY: $(POSTMAN_API_KEY)

  - script: |
      postman collection run 1273809-cdf08318-6fff-48af-a18d-ba4d2e2ec21f \
        -e 1273809-6dd814a7-aeb2-46d9-a9da-8a9164b22db7 \
        --env-var "companyAdmin=$(COMPANY)" \
        --env-var "userNameAdmin=$(ADMIN_USER)" \
        --env-var "passwordAdmin=$(ADMIN_PASSWORD)" \
        --env-var "company=$(COMPANY)" \
        --env-var "userName=$(NORMAL_USER)" \
        --env-var "password=$(NORMAL_PASSWORD)" \
        --env-var "AuthAPI=$(AUTH_URL)" \
        --env-var "language=$(LANGUAGE)" \
        --env-var "userIdAdmin=$(USER_ID_ADMIN)" \
        --env-var "nameAdmin=$(NAME_ADMIN)" \
        --env-var "emailAdmin=$(EMAIL_ADMIN)" \
        --env-var "companyKeyAdmin=$(COMPANY_KEY_ADMIN)" \
        --env-var "userId=$(USER_ID)" \
        --env-var "name=$(NAME)" \
        --env-var "email=$(EMAIL)" \
        --env-var "companyKey=$(COMPANY_KEY)" \
        --reporters cli,junit,html \
        --reporter-junit-export $(Build.ArtifactStagingDirectory)/postman-results.xml \
        --reporter-html-export $(Build.ArtifactStagingDirectory)/newman-report.html
    displayName: Run Postman collection

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: postman-results.xml
      searchFolder: $(Build.ArtifactStagingDirectory)
      testRunTitle: Postman – $(Build.BuildNumber)
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Postman HTML report
    condition: always()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/newman-report.html
      artifactName: postman-html-report

