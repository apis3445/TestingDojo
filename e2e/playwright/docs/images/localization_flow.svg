<svg width="700" height="300" viewBox="0 0 700 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="300" rx="12" fill="white"/>

  <!-- JSON Files -->
  <rect x="50" y="50" width="120" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="75" font-family="monospace" font-size="14" fill="#1E40AF" text-anchor="middle">en-US.json</text>
  
  <rect x="50" y="100" width="120" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <text x="110" y="125" font-family="monospace" font-size="14" fill="#1E40AF" text-anchor="middle" opacity="0.6">es-MX.json</text>
  
  <rect x="50" y="150" width="120" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" opacity="0.3"/>
  <text x="110" y="175" font-family="monospace" font-size="14" fill="#1E40AF" text-anchor="middle" opacity="0.3">ja-JP.json</text>

  <!-- Arrow to BasePage -->
  <path d="M180 120 H250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="215" y="110" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Loaded by</text>

  <!-- BasePage -->
  <rect x="260" y="80" width="180" height="80" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="350" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#14532D" text-anchor="middle">BasePage</text>
  <text x="350" y="135" font-family="monospace" font-size="13" fill="#166534" text-anchor="middle">this.localeInfo</text>

  <!-- Arrow to Component -->
  <path d="M450 120 H520" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="110" font-family="Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Passed to</text>

  <!-- Component -->
  <rect x="530" y="80" width="140" height="80" rx="8" fill="#FAF5FF" stroke="#A855F7" stroke-width="2"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#581C87" text-anchor="middle">Component</text>
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="12" fill="#7E22CE" text-anchor="middle">Uses translated text</text>

  <!-- Example Label -->
  <rect x="260" y="210" width="410" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 4"/>
  <text x="275" y="235" font-family="monospace" font-size="13" fill="#475569">new Button(page, localeInfo.home.login)</text>
</svg>
