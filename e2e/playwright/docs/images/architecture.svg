<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="white"/>
  
  <!-- Definitions for arrows and shadows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 1. Test Layer -->
  <rect x="200" y="40" width="400" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Test file (.spec.ts)</text>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">Describes WHAT to test. Uses page objects.</text>

  <!-- Arrow 1 to 2 -->
  <path d="M400 120 V150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="145" font-family="Arial, sans-serif" font-size="12" fill="#64748b">uses</text>

  <!-- 2. Page Object Layer -->
  <rect x="200" y="160" width="400" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#14532d" text-anchor="middle">Page Object (pages/)</text>
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="14" fill="#166534" text-anchor="middle">Describes HOW to interact with a screen.</text>

  <!-- Arrows 2 to 3 -->
  <path d="M300 240 V270" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M500 240 V270" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="12" fill="#64748b">composes</text>

  <!-- 3. Components Layer -->
  <rect x="150" y="280" width="220" height="80" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="260" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#581c87" text-anchor="middle">Component (e.g. Button)</text>
  <text x="260" y="335" font-family="Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle">Wraps UI elements + logs steps</text>

  <rect x="430" y="280" width="220" height="80" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#581c87" text-anchor="middle">Component (e.g. Input)</text>
  <text x="540" y="335" font-family="Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle">Wraps UI elements + logs steps</text>

  <!-- Arrows 3 to 4 -->
  <path d="M260 360 L350 395" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M540 360 L450 395" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">calls</text>

  <!-- 4. Playwright API -->
  <rect x="250" y="400" width="300" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Playwright Library API</text>

  <!-- Arrow 4 to 5 -->
  <path d="M400 460 V490" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="485" font-family="Arial, sans-serif" font-size="12" fill="#64748b">controls</text>

  <!-- 5. App/Browser -->
  <rect x="250" y="500" width="300" height="60" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle">Application Under Test</text>
</svg>
