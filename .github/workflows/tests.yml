name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:

  guard-env-files:
    name: Guard against committed .env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if tracked .env files are present
        run: |
          matches=$(git ls-files | grep -E '(^|/)\.env[^/]*$' | grep -vE '\.example$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Tracked .env file(s) found — remove them and rotate any exposed credentials:"
            echo "$matches"
            exit 1
          fi

  playwright:
    name: Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e/playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          AUTH_URL: ${{ vars.AUTH_URL }}
          COMPANY: ${{ vars.COMPANY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NORMAL_USER: ${{ secrets.NORMAL_USER }}
          NORMAL_PASSWORD: ${{ secrets.NORMAL_PASSWORD }}
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright/playwright-report/
          retention-days: 30
      - name: Deploy Playwright report to GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: e2e/playwright/playwright-report
          destination_dir: playwright-report

  dotnet:
    name: .NET API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Build
        run: dotnet build
      - name: Run tests
        env:
          USER_ADMIN_COMPANY: ${{ vars.COMPANY }}
          USER_ADMIN_USERNAME: ${{ secrets.ADMIN_USER }}
          USER_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          USER_COMPANY: ${{ vars.COMPANY }}
          USER_USERNAME: ${{ secrets.NORMAL_USER }}
          USER_PASSWORD: ${{ secrets.NORMAL_PASSWORD }}
        run: dotnet run --project APINet/APINet.csproj

  postman:
    name: Postman (Postman CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Postman collection
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: |
            collection run "1273809-cdf08318-6fff-48af-a18d-ba4d2e2ec21f" \
              -e "1273809-6dd814a7-aeb2-46d9-a9da-8a9164b22db7" \
              --env-var "companyAdmin=${{ vars.COMPANY }}" \
              --env-var "userNameAdmin=${{ secrets.ADMIN_USER }}" \
              --env-var "passwordAdmin=${{ secrets.ADMIN_PASSWORD }}" \
              --env-var "company=${{ vars.COMPANY }}" \
              --env-var "userName=${{ secrets.NORMAL_USER }}" \
              --env-var "password=${{ secrets.NORMAL_PASSWORD }}" \
              --env-var "AuthAPI=${{ vars.AUTH_URL }}" \
              --env-var "language=${{ vars.LANGUAGE }}" \
              --env-var "userIdAdmin=${{ vars.USER_ID_ADMIN }}" \
              --env-var "nameAdmin=${{ vars.NAME_ADMIN }}" \
              --env-var "emailAdmin=${{ vars.EMAIL_ADMIN }}" \
              --env-var "companyKeyAdmin=${{ vars.COMPANY_KEY_ADMIN }}" \
              --env-var "userId=${{ vars.USER_ID }}" \
              --env-var "name=${{ vars.NAME }}" \
              --env-var "email=${{ vars.EMAIL }}" \
              --env-var "companyKey=${{ vars.COMPANY_KEY }}" \
              --reporters cli,junit \
              --reporter-junit-export results/postman-results.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: postman-report
          path: results/postman-results.xml
          retention-days: 30
